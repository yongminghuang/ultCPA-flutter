name: ultcpa_flutter
description: Flutter migration of the registered ultCPA Android product surface.
publish_to: none
version: 1.2.5+26071018

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dio: ^5.9.0
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  webview_flutter: 4.13.1
  webview_flutter_android: 4.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/images/bg_wel_new.png
    - assets/images/fast_practice/
    - assets/images/pre_exam_six_paper/
    - assets/images/pre_exam_secret_paper/
    - assets/images/smart_card/
    - assets/images/settings/
    - assets/images/vip_purchase/
    - assets/images/main_tabs/
    - assets/images/practice/
    - assets/images/authentication/
    - assets/images/promotion_sharing/
    - assets/images/skill_mnemonics/
